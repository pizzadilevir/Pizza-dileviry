<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizza Delivery Zakho</title>
<style>
:root{
  --bg:#0b0d12; --bg2:#14181f; --card:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.12);
  --accent:#ff7a1a; --accent2:#ffb238; --text:#f2f2f2; --muted:#a9adb8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  height:100%; font-family:'Segoe UI',Tahoma,Arial,sans-serif; color:var(--text);
  background:radial-gradient(circle at 20% 0%, #1a1f2b 0%, var(--bg) 55%), var(--bg);
  min-height:100vh; overflow-x:hidden;
}
.glass{background:var(--card); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:18px;}
.screen{display:none; min-height:100vh; padding:18px; animation:fade .35s ease;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1;}}
.center{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; gap:18px;}
.logo{width:120px; height:120px; border-radius:50%; overflow:hidden; box-shadow:0 0 40px rgba(255,122,26,.35); border:2px solid var(--border);}
.logo img{width:100%; height:100%; object-fit:cover; display:block;}
h1{font-size:1.5rem; background:linear-gradient(90deg,var(--accent2),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.sub{color:var(--muted); font-size:.95rem; line-height:1.6;}
.lang-btn{width:100%; max-width:340px; padding:16px; margin-top:8px; font-size:1.05rem; font-weight:600; color:var(--text); cursor:pointer;}
.lang-btn:active{transform:scale(.97);}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 4px 16px;}
.topbar .name{font-weight:700; font-size:1.15rem;}
.iconbtn{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:9px 12px; color:var(--text); cursor:pointer; font-size:1rem; backdrop-filter:blur(10px);}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.cat-card{padding:20px 12px; text-align:center; cursor:pointer; transition:.2s;}
.cat-card:active{transform:scale(.96); background:rgba(255,122,26,.15);}
.cat-emoji{font-size:2.1rem; margin-bottom:8px;}
.cat-name{font-weight:600; font-size:.98rem;}
.item{display:flex; align-items:center; justify-content:space-between; padding:14px; margin-bottom:10px; gap:10px;}
.item-name{font-weight:600; font-size:1rem; flex:1;}
.item-price{color:var(--accent2); font-weight:700; font-size:.95rem; white-space:nowrap;}
.qty{display:flex; align-items:center; gap:8px;}
.qty button{width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,.08); color:var(--text); font-size:1.1rem; cursor:pointer;}
.qty span{min-width:18px; text-align:center; font-weight:700;}
.fab{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); padding:14px 28px; border-radius:30px; background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#1a1200; font-weight:700; border:none; cursor:pointer; box-shadow:0 8px 24px rgba(255,122,26,.4); z-index:50;}
.cart-line{display:flex; justify-content:space-between; padding:12px; margin-bottom:8px;}
.total-line{display:flex; justify-content:space-between; padding:16px; font-weight:700; font-size:1.1rem; margin-top:6px;}
.wa-btn{display:block; width:100%; padding:15px; text-align:center; border-radius:14px; font-weight:700; text-decoration:none; margin-top:10px; background:#25D366; color:#062a13;}
.locbtn{display:block; width:100%; padding:13px; text-align:center; border-radius:14px; font-weight:600; text-decoration:none; margin-top:12px; color:var(--text); border:1px solid var(--border);}
.editrow{display:flex; gap:8px; margin-top:6px;}
.editrow input{flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:rgba(0,0,0,.3); color:var(--text);}
.small{font-size:.8rem; color:var(--muted); padding:5px 10px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,.05);}
.empty{text-align:center; color:var(--muted); padding:40px 10px;}
[dir="ltr"]{direction:ltr;}
</style>
</head>

let lang = 'ar';
let cart = {};
let adminMode = false;
let tapCount = 0, tapTimer = null;
let menu = loadMenu();

function loadMenu(){
  try{ const s = localStorage.getItem('pd_menu'); if(s) return JSON.parse(s); }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_MENU));
}
function saveMenu(){ try{ localStorage.setItem('pd_menu', JSON.stringify(menu)); }catch(e){} }

function setLang(l){
  lang = l;
  document.body.setAttribute('dir', l==='en' ? 'ltr' : 'rtl');
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key = el.getAttribute('data-t'); if(T[lang][key]) el.textContent = T[lang][key];
  });
  renderCats();
  showScreen('scr-cats');
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderCats(){
  const grid = document.getElementById('cats-grid');
  grid.innerHTML = '';
  Object.keys(CAT_NAMES).forEach(key=>{
    const div = document.createElement('div');
    div.className = 'cat-card glass';
    div.onclick = ()=>openCategory(key);
    div.innerHTML = `<div class="cat-emoji">${CAT_EMOJI[key]}</div><div class="cat-name">${CAT_NAMES[key][lang]}</div>`;
    grid.appendChild(div);
  });
  document.getElementById('loc-link').querySelector('span').textContent = T[lang].location;
}

let currentCat = null;
function openCategory(key){
  currentCat = key;
  document.getElementById('cat-title').textContent = CAT_NAMES[key][lang];
  renderItems();
  showScreen('scr-items');
}

function itemKey(cat, idx){ return cat+'_'+idx; }

function renderItems(){
  const list = document.getElementById('items-list');
  list.innerHTML = '';
  (menu[currentCat]||[]).forEach((it,idx)=>{
    const key = itemKey(currentCat, idx);
    const qty = cart[key] ? cart[key].qty : 0;
    const div = document.createElement('div');
    div.className = 'item glass';
    div.innerHTML = `
      <div style="flex:1;">
        <div class="item-name">${it[0]}</div>
        <div class="item-price">${it[1].toLocaleString()} ${T[lang].currency}</div>
        ${adminMode ? `<div class="editrow"><button class="small" onclick="editItem('${currentCat}',${idx})">✏️ ${T[lang].edit}</button><button class="small" onclick="delItem('${currentCat}',${idx})">🗑️ ${T[lang].del}</button></div>` : ''}
      </div>
      <div class="qty">
        <button onclick="changeQty('${key}',-1,'${currentCat}',${idx})">－</button>
        <span id="q_${key}">${qty}</span>
        <button onclick="changeQty('${key}',1,'${currentCat}',${idx})">＋</button>
      </div>`;
    list.appendChild(div);
  });
  if(adminMode){
    const addDiv = document.createElement('div');
    addDiv.className = 'item glass';
    addDiv.style.justifyContent='center';
    addDiv.innerHTML = `<button class="small" onclick="addItem()">➕ ${T[lang].additem}</button>`;
    list.appendChild(addDiv);
  }
}

function changeQty(key, delta, cat, idx){
  if(!cart[key]) cart[key] = {cat, idx, qty:0};
  cart[key].qty = Math.max(0, cart[key].qty + delta);
  if(cart[key].qty === 0) delete cart[key];
  document.getElementById('q_'+key).textContent = cart[key] ? cart[key].qty : 0;
  updateCartCount();
}

function updateCartCount(){
  const n = Object.values(cart).reduce((a,c)=>a+c.qty,0);
  const txt = n>0 ? ' ('+n+')' : '';
  document.getElementById('cart-count').textContent = txt;
  document.getElementById('cart-count2').textContent = txt;
}

function openCart(){
  const listEl = document.getElementById('cart-list');
  listEl.innerHTML = '';
  let total = 0;
  const keys = Object.keys(cart);
  if(keys.length === 0){
    listEl.innerHTML = `<div class="empty glass">${T[lang].empty_cart}</div>`;
  } else {
    keys.forEach(key=>{
      const c = cart[key];
      const it = menu[c.cat][c.idx];
      const lineTotal = it[1]*c.qty;
      total += lineTotal;
      const div = document.createElement('div');
      div.className = 'cart-line glass';
      div.innerHTML = `<span>${it[0]} × ${c.qty}</span><span>${lineTotal.toLocaleString()} ${T[lang].currency}</span>`;
      listEl.appendChild(div);
    });
  }
  document.getElementById('cart-total').innerHTML = `<span>${T[lang].total}</span><span>${total.toLocaleString()} ${T[lang].currency}</span>`;
  const msg = buildOrderMessage(total);
  document.getElementById('wa1').href = 'https://wa.me/'+WA1+'?text='+encodeURIComponent(msg);
  document.getElementById('wa2').href = 'https://wa.me/'+WA2+'?text='+encodeURIComponent(msg);
  showScreen('scr-cart');
}

function buildOrderMessage(total){
  let lines = ['طلب جديد - بيتزا دليفري:'];
  Object.values(cart).forEach(c=>{
    const it = menu[c.cat][c.idx];
    lines.push(`${it[0]} × ${c.qty} = ${(it[1]*c.qty).toLocaleString()}`);
  });
  lines.push('المجموع: '+total.toLocaleString()+' د.ع');
  return lines.join('\n');
}

// ---- ADMIN ----
function adminTap(){
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{ tapCount = 0; }, 2500);
  if(tapCount >= 3){
    tapCount = 0;
    const code = prompt(T[lang].admin_prompt);
    if(code === ADMIN_CODE){
      adminMode = true;
      alert(T[lang].edit_mode);
      renderItems();
      addAdminBar();
    } else if(code !== null){
      alert(T[lang].wrong_code);
    }
  }
}
function addAdminBar(){
  if(document.getElementById('admin-bar')) return;
  const bar = document.createElement('div');
  bar.id = 'admin-bar';
  bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;padding:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:60;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);';
  bar.innerHTML = `<button class="small" onclick="exportMenu()">💾 ${T[lang].export}</button><button class="small" onclick="resetMenu()">↺ ${T[lang].reset}</button><button class="small" onclick="exitAdmin()">✖ ${T[lang].exit_admin}</button>`;
  document.body.appendChild(bar);
}
function exitAdmin(){ adminMode = false; document.getElementById('admin-bar')?.remove(); renderItems(); }
function editItem(cat, idx){
  const it = menu[cat][idx];
  const newName = prompt(T[lang].name_ph, it[0]);
  if(newName === null) return;
  const newPrice = prompt(T[lang].price_ph, it[1]);
  if(newPrice === null) return;
  menu[cat][idx] = [newName, parseInt(newPrice)||0];
  saveMenu(); renderItems();
}
function delItem(cat, idx){
  if(!confirm(T[lang].del+'?')) return;
  menu[cat].splice(idx,1);
  saveMenu(); renderItems();
}
function addItem(){
  const name = prompt(T[lang].name_ph);
  if(!name) return;
  const price = prompt(T[lang].price_ph);
  menu[currentCat].push([name, parseInt(price)||0]);
  saveMenu(); renderItems();
}
function resetMenu(){
  if(!confirm(T[lang].reset+'?')) return;
  menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
  saveMenu(); renderItems();
}
function exportMenu(){
  const blob = new Blob([JSON.stringify(menu,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pizza_menu_data.json';
  a.click();
}

document.querySelectorAll('img').forEach(img=>{ img.src = LOGO; });
